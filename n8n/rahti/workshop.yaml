###############################################################################
# OpenAI proxy config
###############################################################################
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openai-nginx-conf
data:
  nginx.conf.template: |
    worker_processes auto;
    pid /tmp/nginx.pid;

    events {}

    http {
      access_log /dev/stdout;
      error_log /dev/stderr info;

      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;

      server {
        listen 8080;
        server_name _;

        location /v1/ {
          proxy_pass https://api.openai.com/v1/;

          proxy_set_header Authorization "Bearer ${OPENAI_API_KEY}";
          proxy_set_header Content-Type "application/json";
          proxy_set_header Host api.openai.com;
          proxy_set_header Connection "";

          proxy_http_version 1.1;

          proxy_ssl_server_name on;
          proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
          proxy_ssl_verify on;

          proxy_connect_timeout 30s;
          proxy_send_timeout 300s;
          proxy_read_timeout 300s;
          send_timeout 300s;

          proxy_buffering off;
        }
      }
    }

###############################################################################
# PostgreSQL for Mattermost
###############################################################################
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mattermost-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mattermost-db
  template:
    metadata:
      labels:
        app: mattermost-db
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: workshop-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workshop-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: workshop-secrets
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mattermost-db-data

---
apiVersion: v1
kind: Service
metadata:
  name: mattermost-db
spec:
  selector:
    app: mattermost-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

###############################################################################
# MinIO
###############################################################################
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          args:
            - server
            - /data
            - --console-address
            - :9001
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: workshop-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workshop-secrets
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data

---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001

###############################################################################
# OpenAI proxy
###############################################################################
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openai-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openai-nginx
  template:
    metadata:
      labels:
        app: openai-nginx
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: image-registry.apps.2.rahti.csc.fi/openshift/nginx:latest
          command:
            - /bin/sh
            - -c
          args:
            - envsubst '${OPENAI_API_KEY}' < /etc/nginx/templates/nginx.conf.template > /tmp/nginx.conf && exec nginx -c /tmp/nginx.conf -g 'daemon off;'
          ports:
            - containerPort: 8080
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: workshop-secrets
                  key: OPENAI_API_KEY
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/templates/nginx.conf.template
              subPath: nginx.conf.template
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: nginx-conf
          configMap:
            name: openai-nginx-conf

---
apiVersion: v1
kind: Service
metadata:
  name: openai-proxy
spec:
  selector:
    app: openai-nginx
  ports:
    - name: http
      port: 80
      targetPort: 8080

###############################################################################
# n8n
###############################################################################
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: n8n
          image: docker.n8n.io/n8nio/n8n:latest
          ports:
            - containerPort: 5678
          env:
            - name: HOME
              value: /home/node
            - name: TZ
              value: Europe/Helsinki
            - name: GENERIC_TIMEZONE
              value: Europe/Helsinki
            - name: N8N_RUNNERS_ENABLED
              value: "true"
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: "https"
            - name: N8N_HOST
              value: "n8n-${PROJECT_NAME}.2.rahtiapp.fi"
            - name: N8N_EDITOR_BASE_URL
              value: "https://n8n-${PROJECT_NAME}.2.rahtiapp.fi/"
            - name: WEBHOOK_URL
              value: "https://n8n-${PROJECT_NAME}.2.rahtiapp.fi/"
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "false"
          volumeMounts:
            # IMPORTANT: mount /home/node, not /home/node/.n8n
            - name: data
              mountPath: /home/node
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data

---
apiVersion: v1
kind: Service
metadata:
  name: n8n
spec:
  selector:
    app: n8n
  ports:
    - name: http
      port: 5678
      targetPort: 5678

###############################################################################
# Mattermost
###############################################################################
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mattermost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mattermost
  template:
    metadata:
      labels:
        app: mattermost
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'until nc -z mattermost-db 5432; do echo "waiting for db"; sleep 2; done'
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: mattermost
          image: image-registry.apps.2.rahti.csc.fi/${PROJECT_NAME}/mattermost:latest
          ports:
            - containerPort: 8065
          env:
            - name: TZ
              value: Europe/Helsinki
            - name: MM_SQLSETTINGS_DRIVERNAME
              value: postgres
            - name: MM_SQLSETTINGS_DATASOURCE
              valueFrom:
                secretKeyRef:
                  name: workshop-secrets
                  key: MM_SQLSETTINGS_DATASOURCE
            - name: MM_BLEVESETTINGS_INDEXDIR
              value: /mattermost/bleve-indexes
            - name: MM_SERVICESETTINGS_SITEURL
              value: https://mattermost-${PROJECT_NAME}.2.rahtiapp.fi
            - name: MM_SERVICESETTINGS_ALLOWEDUNTRUSTEDINTERNALCONNECTIONS
              value: n8n,minio,mattermost-db
            - name: MM_TEAMSETTINGS_ENABLEOPENSERVER
              value: "false"
            - name: MM_SERVICESETTINGS_ENABLEPOSTUSERNAMEOVERRIDE
              value: "true"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /mattermost/data
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: 8065
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mattermost-data

---
apiVersion: v1
kind: Service
metadata:
  name: mattermost
spec:
  selector:
    app: mattermost
  ports:
    - name: http
      port: 8065
      targetPort: 8065

