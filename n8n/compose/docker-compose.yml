services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n-local
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      TZ: "Europe/Helsinki"
      GENERIC_TIMEZONE: "Europe/Helsinki"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - minio
      - mattermost

  minio:
    image: quay.io/minio/minio
    container_name: minio-local
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data

  mattermost_db:
    image: postgres:16-alpine
    container_name: mattermost-db-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: "mmuser"
      POSTGRES_PASSWORD: "mm_password_change_me"
      POSTGRES_DB: "mattermost"
    volumes:
      - mattermost_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mattermost:
    image: mattermost/mattermost-team-edition:latest
    platform: linux/amd64
    container_name: mattermost-local
    restart: unless-stopped
    depends_on:
      mattermost_db:
        condition: service_healthy
    ports:
      - "8065:8065"
    environment:
      TZ: "Europe/Helsinki"
      MM_SQLSETTINGS_DRIVERNAME: "postgres"
      MM_SQLSETTINGS_DATASOURCE: "postgres://mmuser:mm_password_change_me@mattermost_db:5432/mattermost?sslmode=disable&connect_timeout=10"
      MM_BLEVESETTINGS_INDEXDIR: "/mattermost/bleve-indexes"
      MM_SERVICESETTINGS_SITEURL: "http://localhost:8065"
      MM_SERVICESETTINGS_ALLOWEDUNTRUSTEDINTERNALCONNECTIONS: "n8n"
    volumes:
      - mattermost_config:/mattermost/config
      - mattermost_data:/mattermost/data
      - mattermost_logs:/mattermost/logs
      - mattermost_plugins:/mattermost/plugins
      - mattermost_client_plugins:/mattermost/client/plugins
      - mattermost_bleve:/mattermost/bleve-indexes

volumes:
  n8n_data:
  minio_data:
  mattermost_pgdata:
  mattermost_config:
  mattermost_data:
  mattermost_logs:
  mattermost_plugins:
  mattermost_client_plugins:
  mattermost_bleve: